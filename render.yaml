services:
  - type: static
    name: neogents-tech
    buildCommand: cd artifacts/mockup-sandbox && npm ci && npm run build
    staticPublishPath: artifacts/mockup-sandbox/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
