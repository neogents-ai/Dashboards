services:
  - type: web
    name: neogents-tech
    env: node
    buildCommand: cd artifacts/neogents-dashboard-verticals && npm ci && npm run build && cd ../../server && npm ci && npm run build
    startCommand: cd server && node dist/index.js
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AFFILIATE_ADMIN_TOKEN
        generateValue: true
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: DATA_DIR
        value: /var/render/data
